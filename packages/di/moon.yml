# https://moonrepo.dev/docs/config/project
$schema: 'https://moonrepo.dev/schemas/project.json'

layer: 'library'
language: 'typescript'

# @fnioc/di INLINES the private @fnioc/core at build time — `bun build` bundles
# core's source into dist/index.js and rollup-plugin-dts inlines its types into
# dist/index.d.ts. core's source is therefore a build input, and `deps:
# ['core:build']` keeps core's typecheck ordered before di's.
dependsOn:
  - 'core'

tasks:
  build:
    # Typecheck first, then bundle: tsc --noEmit catches type errors before bun
    # build.ts produces the dist artefacts.
    script: 'bun x tsc --noEmit -p tsconfig.json && bun build.ts'
    deps:
      - 'core:build'
    inputs:
      - 'src/**/*'
      - 'build.ts'
      - 'rollup.dts.mjs'
      - 'tsconfig.json'
      - '/tsconfig.base.json'
      - '/packages/core/src/**/*'
    outputs:
      - 'dist'
  test:
    command: 'bun test'
    inputs:
      - 'src/**/*'
      - 'test/**/*'
      - 'tsconfig.json'
      - 'package.json'
  lint:
    command: 'bun x tsc --noEmit -p tsconfig.json'
    options:
      cache: false

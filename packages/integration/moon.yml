# https://moonrepo.dev/docs/config/project
$schema: 'https://moonrepo.dev/schemas/project.json'

layer: 'application'
language: 'typescript'

# Integration verification — runs the transformer-compiled sample against the di
# engine. tspc (ts-patch) loads the transformer dist; di and core now resolve
# from source in the workspace (bun condition / source condition), so their dists
# are not required. Only transformer:build is needed as a task dep.
dependsOn:
  - 'transformer'

tasks:
  test:
    command: 'bun test'
    deps:
      - 'transformer:build'
    inputs:
      - 'test/**/*'
      - 'tsconfig.json'
      - 'package.json'
  lint:
    command: 'bun x tsc -p tsconfig.json --noEmit'
    deps:
      - 'transformer:build'
    inputs:
      - 'test/**/*'
      - 'tsconfig.json'
      - '/tsconfig.base.json'

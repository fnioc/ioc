# https://moonrepo.dev/docs/config/project
$schema: 'https://moonrepo.dev/schemas/project.json'

layer: 'library'
language: 'typescript'

# @fnioc/core is PRIVATE and source-only — it emits no `dist`. `build` is a
# typecheck (`tsc --noEmit`) so the workspace still validates core's types; its
# source is inlined into @fnioc/di and @fnioc/transformer at their build time.
tasks:
  build:
    command: 'bun run build'
    inputs:
      - 'src/**/*'
      - 'tsconfig.json'
      - '/tsconfig.base.json'
  test:
    command: 'bun run test'
    inputs:
      - 'src/**/*'
      - 'test/**/*'
      - 'tsconfig.json'
      - 'package.json'
  lint:
    command: 'bun run lint'
    options:
      cache: false

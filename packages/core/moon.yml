# https://moonrepo.dev/docs/config/project
$schema: 'https://moonrepo.dev/schemas/project.json'

layer: 'library'
language: 'typescript'

# @fnioc/core is a PURE-TYPES package. `build` rolls a single self-contained
# dist/index.d.ts (rollup-plugin-dts, func types inlined) for publication and
# asserts no runtime .js is emitted; `lint` typechecks the source. There is no
# `test` task — core ships no runtime, so the token-grammar / slot-constructor
# behaviour tests live in @fnioc/di alongside the relocated implementations.
tasks:
  build:
    command: 'bun build.ts'
    inputs:
      - 'src/**/*'
      - 'build.ts'
      - 'rollup.dts.mjs'
      - 'tsconfig.json'
      - '/tsconfig.base.json'
    outputs:
      - 'dist'
  lint:
    command: 'bun x tsc --noEmit -p tsconfig.json'
    options:
      cache: false

# https://moonrepo.dev/docs/config/project
$schema: 'https://moonrepo.dev/schemas/project.json'

layer: 'library'
language: 'typescript'

# Build-time only. Shares the ABI/token format from @fnioc/core (project
# reference); does NOT depend on @fnioc/di.
dependsOn:
  - 'core'

tasks:
  build:
    command: 'bun run build'
    deps:
      - 'core:build'
    inputs:
      - 'src/**/*'
      - 'tsconfig.json'
      - '/tsconfig.base.json'
    outputs:
      - 'dist'
  test:
    command: 'bun run test'
    # The ts-patch e2e (test/e2e.test.ts) loads the BUILT @fnioc/transformer as a
    # plugin and runs `node tspc`, which resolves both @fnioc/transformer and the
    # injected @fnioc/core import via their `dist` entry points. Both must be
    # built first; `build` transitively pulls `core:build`, but naming both keeps
    # the ordering intent explicit and the dist outputs as cache inputs.
    deps:
      - 'build'
      - 'core:build'
    inputs:
      - 'src/**/*'
      - 'test/**/*'
      - 'tsconfig.json'
      - 'package.json'
  lint:
    command: 'bun run lint'
    options:
      cache: false

# https://moonrepo.dev/docs/config/project
$schema: 'https://moonrepo.dev/schemas/project.json'

layer: 'library'
language: 'typescript'

# Build-time only. The transformer's RUNTIME bundle carries no @fnioc import
# (the @fnioc/di reference it emits lives in generated strings), so the emitted
# JS stays @fnioc-free. Its TYPE surface augments @fnioc/di: `augment.ts` carries
# the `declare module "@fnioc/di"` block (the type-only authoring forms
# `add<I>(C)`, `.as<"x">()`, `resolve<T>()`) and references di's exported types.
# The tsconfig `customConditions: ["source"]` routes `@fnioc/di` to di's SOURCE
# tree via di's package.json `"source"` export, so both lint and the d.ts rollup
# (rollup-plugin-dts uses the same tsconfig) resolve @fnioc/di from source
# without needing di's dist present.
dependsOn:
  - 'core'
  - 'di'

tasks:
  build:
    # Typecheck first, then bundle: tsc --noEmit catches type errors before bun
    # build.ts produces the dist artefacts.
    script: 'bun x tsc --noEmit -p tsconfig.json && bun build.ts'
    deps:
      - 'core:build'
    inputs:
      - 'src/**/*'
      - 'build.ts'
      - 'rollup.dts.mjs'
      - 'tsconfig.json'
      - '/tsconfig.base.json'
      - '/packages/di/src/**/*'
    outputs:
      - 'dist'
  test:
    command: 'bun test'
    # The ts-patch e2e (test/e2e.test.ts) loads the BUILT @fnioc/transformer as a
    # plugin and runs `node tspc`, which resolves both @fnioc/transformer and the
    # injected @fnioc/core import via their `dist` entry points. Both must be
    # built first; `build` transitively pulls `core:build`, but naming both keeps
    # the ordering intent explicit and the dist outputs as cache inputs.
    deps:
      - 'build'
      - 'core:build'
    inputs:
      - 'src/**/*'
      - 'test/**/*'
      - 'tsconfig.json'
      - 'package.json'
  lint:
    command: 'bun x tsc --noEmit -p tsconfig.json'
    # `augment.ts` typechecks against @fnioc/di's exported types. The tsconfig
    # `customConditions: ["source"]` routes `@fnioc/di` to source, so no di:build
    # dep is needed here.
    options:
      cache: false

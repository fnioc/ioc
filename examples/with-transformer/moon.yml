# https://moonrepo.dev/docs/config/project
$schema: 'https://moonrepo.dev/schemas/project.json'

id: 'examples-with-transformer'
layer: 'application'
language: 'typescript'

# A real external consumer: imports @fnioc/di + @fnioc/transformer as bare
# specifiers via workspace:* deps. Both must be built first — the build runs
# tspc (which loads the transformer plugin + injects a bare @fnioc/di import the
# emitted dist resolves at runtime), so `deps` order di/transformer builds ahead.
dependsOn:
  - 'di'
  - 'transformer'

tasks:
  build:
    command: 'bun run build'
    deps:
      - 'di:build'
      - 'transformer:build'
    inputs:
      - 'src/**/*'
      - 'tsconfig.json'
      - 'package.json'
      - '/tsconfig.base.json'
    outputs:
      - 'dist'
  test:
    command: 'bun run test'
    deps:
      - 'build'
    inputs:
      - 'src/**/*'
      - 'expected.txt'
      - 'tsconfig.json'
      - 'package.json'
  lint:
    command: 'bun run lint'
    deps:
      - 'di:build'
      - 'transformer:build'
    inputs:
      - 'src/**/*'
      - 'tsconfig.json'
      - '/tsconfig.base.json'
    options:
      cache: false

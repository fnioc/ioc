# https://moonrepo.dev/docs/config/project
$schema: 'https://moonrepo.dev/schemas/project.json'

id: 'examples-with-transformer'
layer: 'application'
language: 'typescript'

# A real external consumer: imports @fnioc/di + @fnioc/transformer as bare
# specifiers via workspace:* deps, and the shared example services via a relative
# source path (tspc compiles that source into this example's own dist — no
# bundler). di + transformer must be built first — the build runs tspc (which
# loads the transformer plugin + injects a bare @fnioc/di import the emitted dist
# resolves at runtime), so `deps` order di/transformer builds ahead.
dependsOn:
  - 'di'
  - 'transformer'
  - 'examples-shared'

tasks:
  build:
    command: 'node node_modules/ts-patch/bin/tspc.js -p tsconfig.json'
    deps:
      - 'di:build'
      - 'transformer:build'
    inputs:
      - 'src/**/*'
      - '/examples/shared/src/**/*'
      - 'tsconfig.json'
      - 'package.json'
      - '/tsconfig.base.json'
    outputs:
      - 'dist'
  test:
    # Run the compiled output and diff against the golden snapshot.
    script: 'node dist/with-transformer/src/main.js > /tmp/fnioc-with-transformer.out && diff -u expected.txt /tmp/fnioc-with-transformer.out'
    deps:
      - 'build'
    inputs:
      - 'src/**/*'
      - '/examples/shared/src/**/*'
      - 'expected.txt'
      - 'tsconfig.json'
      - 'package.json'
  lint:
    command: 'bun x tsc --noEmit -p tsconfig.json'
    deps:
      - 'transformer:build'
    inputs:
      - 'src/**/*'
      - '/examples/shared/src/**/*'
      - 'tsconfig.json'
      - '/tsconfig.base.json'
    options:
      cache: false

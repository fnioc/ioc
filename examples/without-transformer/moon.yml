# https://moonrepo.dev/docs/config/project
$schema: 'https://moonrepo.dev/schemas/project.json'

id: 'examples-without-transformer'
layer: 'application'
language: 'typescript'

# A real external consumer: imports @fnioc/di as a bare specifier via a
# workspace:* dep, resolved at runtime through the symlink to its built dist, and
# the shared example services via a relative source path (plain tsc compiles that
# source into this example's own dist — no bundler). No transformer / ts-patch —
# registration and metadata are hand-written.
dependsOn:
  - 'di'
  - 'examples-shared'

tasks:
  build:
    command: 'bun x tsc -p tsconfig.json'
    deps:
      - 'di:build'
    inputs:
      - 'src/**/*'
      - '/examples/shared/src/**/*'
      - 'tsconfig.json'
      - 'package.json'
      - '/tsconfig.base.json'
    outputs:
      - 'dist'
  test:
    # Run the compiled output and diff against the golden snapshot.
    script: 'node dist/without-transformer/src/main.js > /tmp/fnioc-without-transformer.out && diff -u expected.txt /tmp/fnioc-without-transformer.out'
    deps:
      - 'build'
    inputs:
      - 'src/**/*'
      - '/examples/shared/src/**/*'
      - 'expected.txt'
      - 'tsconfig.json'
      - 'package.json'
  lint:
    command: 'bun x tsc --noEmit -p tsconfig.json'
    inputs:
      - 'src/**/*'
      - '/examples/shared/src/**/*'
      - 'tsconfig.json'
      - '/tsconfig.base.json'
    options:
      cache: false

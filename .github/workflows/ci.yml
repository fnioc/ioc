name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  merge_group:

# On PRs and merge queue: cancel stale runs when new commits arrive.
# On push to main: never cancel — a publish mid-flight must complete.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' || github.event_name == 'merge_group' }}

jobs:

  # ── Verify ────────────────────────────────────────────────────────────────
  # Make this job a required status check on main in branch protection settings.
  #
  # Toolchain: Bun (runtime + package manager + test runner) and moon (task
  # orchestration). Both pinned in mise.toml — mise-action installs whatever
  # mise.toml asks for, keeping one source of truth between local dev and CI.
  verify:
    runs-on: ubuntu-latest
    steps:
      # actions/checkout@v4 intermittently fails with
      # `fatal: could not read Username for 'https://github.com'`. Three-attempt
      # retry absorbs the flake; the final attempt has no continue-on-error so a
      # real failure still fails the job.
      - uses: actions/checkout@v4
        id: checkout-1
        continue-on-error: true
        with:
          # moon resolves a touched-files baseline against the default branch
          # for incremental task scheduling. Without fetching it, moon errors
          # with `fatal: ambiguous argument 'main': unknown revision`.
          fetch-depth: 0
      - uses: actions/checkout@v4
        if: steps.checkout-1.outcome == 'failure'
        id: checkout-2
        continue-on-error: true
        with:
          fetch-depth: 0
      - uses: actions/checkout@v4
        if: steps.checkout-1.outcome == 'failure' && steps.checkout-2.outcome == 'failure'
        with:
          fetch-depth: 0
      - uses: jdx/mise-action@v2
        with:
          experimental: true
      - run: bun install --frozen-lockfile
      - run: moon run :lint
      - run: moon run :test
      - run: moon run :build

  # ── Publish ───────────────────────────────────────────────────────────────
  # Runs on every push to main. release-please-action either opens/updates a
  # per-package release PR or, when one is merged, tags the release. We then build
  # and publish to the `@next` dist-tag every managed package whose committed
  # version is not yet on `@next` — manifest-driven and idempotent, deliberately
  # NOT keyed on release-please's `paths_released` (see the selection step for why).
  #
  # Two-stage publish: every release publishes to `@next` automatically here.
  # Promotion to `@latest` is a separate, manual step — see promote.yml. A
  # release never lands on `@latest` automatically.
  #
  # Flow: feature PR merges → release-please opens/updates a release PR →
  # release PR merges (gated on `verify` via the merge queue) → this job fires
  # again and publishes the just-released packages to `@next`.
  #
  # Auth: npm trusted-publisher OIDC (id-token: write). No NPM_TOKEN secret.
  # Trusted-publisher config on npmjs.com pins provider=GitHub Actions,
  # repo=fnioc/ioc, workflow=ci.yml — so this file must stay named ci.yml.
  publish:
    needs: verify
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write       # release-please creates tags + GitHub releases
      pull-requests: write  # release-please opens/updates release PRs
      id-token: write       # OIDC — npm trusted-publisher auth + provenance
    steps:
      # The release-please + publish chain needs AUTOMERGE_PAT. Until that
      # secret is set, no-op cleanly with a notice instead of failing CI red —
      # the moment the PAT lands, releases flow with no further change.
      - name: Detect release automation token
        id: token_check
        env:
          AUTOMERGE_PAT: ${{ secrets.AUTOMERGE_PAT }}
        run: |
          if [ -n "$AUTOMERGE_PAT" ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "::notice::AUTOMERGE_PAT not set — skipping release-please/publish. Set the secret to enable releases."
          fi

      - uses: googleapis/release-please-action@v4
        id: release
        if: steps.token_check.outputs.present == 'true'
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
          # PAT (not GITHUB_TOKEN) so release-please's PRs fire downstream
          # workflow events (auto-merge.yml, CI). PRs opened by GITHUB_TOKEN are
          # suppressed from triggering workflows — that would leave release PRs
          # sitting open forever waiting for a `verify` run that never starts.
          token: ${{ secrets.AUTOMERGE_PAT }}

      - uses: actions/checkout@v4
        if: ${{ steps.release.outputs.releases_created == 'true' }}
        id: checkout-1
        continue-on-error: true
      - uses: actions/checkout@v4
        if: ${{ steps.release.outputs.releases_created == 'true' && steps.checkout-1.outcome == 'failure' }}
        id: checkout-2
        continue-on-error: true
      - uses: actions/checkout@v4
        if: ${{ steps.release.outputs.releases_created == 'true' && steps.checkout-1.outcome == 'failure' && steps.checkout-2.outcome == 'failure' }}

      - uses: actions/setup-node@v4
        if: ${{ steps.release.outputs.releases_created == 'true' }}
        with:
          node-version: lts/*
          registry-url: https://registry.npmjs.org

      # OIDC trusted publishing requires npm >= 11.5.1, but setup-node ships
      # npm 10.x. Upgrade to latest before any publish step runs.
      - name: Upgrade npm for OIDC trusted publishing
        if: ${{ steps.release.outputs.releases_created == 'true' }}
        run: npm install -g npm@latest

      - uses: jdx/mise-action@v2
        if: ${{ steps.release.outputs.releases_created == 'true' }}
        with:
          experimental: true

      - name: Install dependencies
        if: ${{ steps.release.outputs.releases_created == 'true' }}
        run: bun install

      # Unlike fnclaude (a Bun-run app that publishes its TS source), ioc is a
      # library consumed under node/webpack/vite/tsc. Each package ships built
      # JS + .d.ts from dist/. Build before publish so the tarball has dist/.
      - name: Build all packages
        if: ${{ steps.release.outputs.releases_created == 'true' }}
        run: moon run :build

      # Select which managed packages to publish to @next — MANIFEST-DRIVEN and
      # IDEMPOTENT, deliberately NOT release-please's `paths_released`.
      #
      # `paths_released` lists only the packages release-please TAGGED this run,
      # and a lockstep release is not reliably atomic: release-please can tag one
      # member of the group and then, once a sibling's manifest version has no
      # matching tag, its bootstrap logic treats that version as "already released"
      # and skips it — so `paths_released` omits it and the old loop silently
      # shipped a partial (split) release. (This is exactly how 10.1.0 shipped core
      # only, stranding di/transformer at 10.0.0 on @next.)
      #
      # Instead: publish every managed package (keys of the release-please manifest)
      # whose committed package.json version is not yet its @next dist-tag on npm.
      # A partial release-creation then self-heals into a complete lockstep publish,
      # and the step is safe to re-run — a package already at its version on @next
      # is skipped. Order is irrelevant at publish time (di/transformer inline
      # core's types and carry no @fnioc/core dep; transformer's @fnioc/di is a
      # consumer-installed peer), so the set is emitted sorted for determinism.
      - name: Select packages needing an @next publish (manifest-driven, idempotent)
        id: sorted
        if: ${{ steps.release.outputs.releases_created == 'true' }}
        run: |
          set -euo pipefail
          need='[]'
          for pkg_path in $(jq -r 'keys[]' .release-please-manifest.json); do
            name=$(jq -r .name "$pkg_path/package.json")
            committed=$(jq -r .version "$pkg_path/package.json")
            published=$(npm view "$name@next" version 2>/dev/null || echo "")
            if [ "$committed" != "$published" ]; then
              echo "$name: committed=$committed, @next=${published:-<none>} -> PUBLISH"
              need=$(printf '%s' "$need" | jq -c --arg p "$pkg_path" '. + [$p]')
            else
              echo "$name: committed=$committed already on @next -> skip"
            fi
          done
          sorted=$(printf '%s' "$need" | jq -c 'sort')
          echo "Publish set: $sorted"
          echo "sorted=${sorted}" >> "$GITHUB_OUTPUT"

      # Strip the workspace @fnioc/core devDependency before packing. Although
      # @fnioc/core is now itself published (as pure types), di and transformer do
      # NOT depend on it: they INLINE core's types into their own dist (rolled into
      # the .d.ts), so their published packages must not reference @fnioc/core.
      # Their committed package.json keeps the `workspace:*` devDependency for
      # local builds; pnpm pack would rewrite that protocol to a concrete version,
      # so strip it before pack so it never appears in the tarball manifest. On
      # core's own package.json this is a harmless no-op (core has no @fnioc/core
      # dep of its own).
      - name: Strip workspace @fnioc/core dep before publish
        if: ${{ steps.release.outputs.releases_created == 'true' }}
        env:
          SORTED: ${{ steps.sorted.outputs.sorted }}
        run: |
          set -euo pipefail
          echo "$SORTED" | jq -r '.[]' | while read -r pkg_path; do
            pkg_json="$pkg_path/package.json"
            echo "::group::Stripping @fnioc/core from $pkg_json"
            tmp=$(mktemp)
            jq 'del(.dependencies["@fnioc/core"], .devDependencies["@fnioc/core"], .peerDependencies["@fnioc/core"], .optionalDependencies["@fnioc/core"])' \
              "$pkg_json" > "$tmp"
            mv "$tmp" "$pkg_json"
            jq '{dependencies, devDependencies, peerDependencies}' "$pkg_json"
            echo "::endgroup::"
          done

      # Pack and publish each released package via pnpm + npm.
      #
      # Why pnpm pack:
      #   @fnioc/di's workspace package.json carries dev-time source exports
      #   (main/types/exports point at ./src/index.ts so edits are immediately
      #   visible in the workspace without a build step). pnpm pack applies
      #   `publishConfig` overrides — rewriting those fields to the dist-pointing
      #   values in the tarball — and rewrites workspace:* protocol deps to concrete
      #   semver ranges. bun pm pack (verified locally) does not apply publishConfig
      #   field overrides (oven-sh/bun#15601 still open as of 2026-06-04), so pnpm
      #   is used for packing. pnpm is pinned via mise.toml (pnpm = "10").
      #
      # Why npm publish <tarball>:
      #   npm trusted-publisher OIDC authenticates the publish. pnpm publish's OIDC
      #   path had a regression in pnpm 11 (pnpm/pnpm#11513, fixed, but v10 avoids
      #   the risk). Using npm for the actual publish keeps OIDC on the proven path
      #   and lets --provenance attach an attestation via the same OIDC token.
      #
      # @latest is promoted separately by promote.yml (manual).
      - name: Pack and publish released packages
        if: ${{ steps.release.outputs.releases_created == 'true' }}
        env:
          SORTED: ${{ steps.sorted.outputs.sorted }}
        run: |
          set -euo pipefail
          echo "$SORTED" | jq -r '.[]' | while read -r pkg_path; do
            echo "::group::Packing and publishing $pkg_path"
            tarball=$(cd "$pkg_path" && pnpm pack --pack-destination /tmp 2>&1 | grep '\.tgz$' | tail -1)
            npm publish "$tarball" --provenance --tag next
            echo "::endgroup::"
          done
